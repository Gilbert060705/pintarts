version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: art_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: art_recommender
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - art_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d art_recommender"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: art_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - art_network
    depends_on:
      db:
        condition: service_healthy

networks:
  art_network:
    driver: bridge